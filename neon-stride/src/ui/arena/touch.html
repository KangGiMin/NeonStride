<div class="touch-controls" id="touchControls">
  <button id="touchLeft" aria-label="왼쪽 이동, 코너 구간에서는 좌회전">
    ←<span>MOVE / TURN</span>
  </button>
  <button id="touchSlide" aria-label="슬라이딩">↓<span>SLIDE</span></button
  ><button id="touchJump" aria-label="점프 또는 2단 점프">
    ↑<span>JUMP ×2</span>
  </button>
  <button id="touchRight" aria-label="오른쪽 이동, 코너 구간에서는 우회전">
    →<span>MOVE / TURN</span>
  </button>
</div>
