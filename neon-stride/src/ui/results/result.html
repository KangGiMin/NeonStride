<div class="result panel" id="result" hidden>
  <span class="tag" id="resultTag">RUN TERMINATED</span>
  <h2 id="resultTitle">GAME OVER</h2>
  <p id="reason"></p>
  <div class="final-score" id="finalScore">0</div>
  <span class="eyebrow">TOTAL SCORE</span>
  <div class="run-stats">
    <div><span>달린 시간</span><b id="finalTime">0:00</b></div>
    <div><span>이동 거리</span><b id="finalDistance">0 m</b></div>
    <div><span>통과한 장애물</span><b id="finalCleared">0</b></div>
  </div>
  <p class="new-best" id="newBest" hidden>↗ 새로운 최고 기록!</p>
  <button class="primary" id="restart">
    <span>다시 달리기</span><span>↗</span>
  </button>
</div>
